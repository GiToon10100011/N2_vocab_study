name: 데이터 백업

# Neon 무료 플랜은 시점 복구 보존 기간이 짧다.
# 매일 덤프해서 backups/ 에 커밋하면 git 히스토리가 그대로 날짜별 스냅샷이 된다.
on:
  schedule:
    # 20:00 UTC = 05:00 KST. 하루 경계(04:00 KST)가 지난 뒤에 돌린다.
    - cron: "0 20 * * *"
  workflow_dispatch: # 수동 실행

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # 백업에 필요한 건 @neondatabase/serverless 와 papaparse 뿐이다.
      # 개발 의존성(Playwright, Lighthouse)까지 받으면 느리고 실패할 여지만 늘어난다.
      - run: npm ci --omit=dev

      - name: 덤프
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL 시크릿이 비어 있습니다."
            exit 1
          fi
          node scripts/backup.mjs backups
          # 덤프가 실제로 내용을 담았는지 확인한다. 헤더만 있는 파일을 커밋하면
          # 백업이 도는 것처럼 보이면서 실은 비어 있게 된다.
          node -e '
            const m = require("./backups/meta.json");
            console.log(`words ${m.words} · reviews ${m.reviews}`);
            if (m.words === 0) { console.error("::error::단어가 0개입니다. 연결 대상을 확인하세요."); process.exit(1); }
          ' 

      - name: 변경이 있을 때만 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # meta.json 은 매번 시각이 바뀌므로 데이터가 실제로 바뀐 경우에만 함께 커밋한다.
          if git diff --quiet -- backups/words.csv backups/reviews.csv; then
            echo "변경 없음 - 건너뜀"
            git checkout -- backups/meta.json 2>/dev/null || true
            exit 0
          fi
          git add backups
          git commit -m "백업: $(date -u '+%Y-%m-%d')"
          git push
